name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app to keep awake
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Repository secret STREAMLIT_APP_URL not set — skipping ping."
            exit 0
          fi
          echo "Pinging $APP_URL"
            # Attempt a HEAD and follow redirects, then log final HTTP status and effective URL
            curl -sS --max-time 10 -I -L "$APP_URL" || true
            res=$(curl -sS -o /dev/null -w "%{http_code} %{url_effective}" --max-time 10 -L "$APP_URL" || echo "000 $APP_URL")
            echo "Final result: $res"
