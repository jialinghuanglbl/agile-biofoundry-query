name: Keep Streamlit App Awake

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app to keep awake
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Repository secret STREAMLIT_APP_URL not set — skipping ping."
            exit 0
          fi
          echo "Pinging $APP_URL"
          curl -sS --max-time 10 -I "$APP_URL" || curl -sS --max-time 10 "$APP_URL" || true
